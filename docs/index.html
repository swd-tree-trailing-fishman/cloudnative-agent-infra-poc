<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cloud Native AI Agent Infra PoC</title>
  <style>
    :root {
      --bg: #07090f;
      --surface: #0d1117;
      --card: #161b27;
      --border: #21293d;
      --border-hi: #3d4f6e;
      --text: #cdd9f0;
      --muted: #6b7a99;
      --go: #00aed8;
      --py: #ffd43b;
      --k8s: #326ce5;
      --istio: #7c83ff;
      --keda: #56d4a0;
      --otel: #ffa94d;
      --red: #ff6b9d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.72;
      letter-spacing: -.01em;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: .8rem 2rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav .logo { font-weight: 700; font-size: 1rem; color: var(--istio); white-space: nowrap; }
    nav a { color: var(--muted); text-decoration: none; font-size: .85rem; padding: .3rem .7rem; border-radius: 6px; transition: .2s; }
    nav a:hover, nav a.active { background: var(--card); color: var(--text); }
    nav .sep { color: var(--border-hi); font-size: .75rem; }

    /* MAIN */
    main { max-width: 860px; margin: 0 auto; padding: 3.5rem 2rem 8rem; }

    /* LOADING */
    #loading {
      text-align: center;
      padding: 6rem 2rem;
      color: var(--muted);
      font-size: .9rem;
    }
    #loading .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--istio);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ERROR */
    #error {
      display: none;
      margin: 4rem auto;
      max-width: 540px;
      background: var(--card);
      border: 1px solid var(--red);
      border-radius: 12px;
      padding: 2rem;
    }
    #error h3 { color: var(--red); margin-bottom: .8rem; }
    #error code { background: var(--surface); border-radius: 4px; padding: .15rem .4rem; font-family: monospace; font-size: .85rem; color: var(--otel); }

    /* ── MARKDOWN RENDERED CONTENT ── */
    #content h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--istio) 0%, var(--keda) 60%, var(--go) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 3rem 0 1rem;
      line-height: 1.2;
    }
    #content h1:first-child { margin-top: 0; }

    #content h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--istio);
      margin: 4rem 0 1.5rem;
      padding-bottom: .6rem;
      border-bottom: 1px solid var(--border);
    }
    #content h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--keda);
      margin: 2.5rem 0 .9rem;
    }
    #content h4 {
      font-size: .95rem;
      font-weight: 600;
      color: var(--otel);
      margin: 2rem 0 .7rem;
    }

    #content p {
      font-size: .93rem;
      line-height: 1.8;
      color: var(--text);
      margin-bottom: 1rem;
    }

    #content ul, #content ol {
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }
    #content li {
      font-size: .93rem;
      line-height: 1.9;
      color: var(--text);
    }
    #content li + li { margin-top: .1rem; }

    #content a {
      color: var(--istio);
      text-decoration: none;
    }
    #content a:hover { text-decoration: underline; }

    #content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.5rem 0;
    }

    #content strong { color: #e2eaf8; }
    #content em { color: var(--muted); }

    /* Inline code */
    #content code {
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: .83em;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: .1em .4em;
      color: var(--otel);
    }

    /* Code block */
    #content pre {
      background: #0a0d16;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.3rem 1.5rem;
      overflow-x: auto;
      margin: 1rem 0 1.5rem;
      line-height: 1.65;
    }
    #content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: .83rem;
      color: var(--text);
    }

    /* Blockquote (used for term definitions) */
    #content blockquote {
      border-left: 3px solid var(--istio);
      margin: 1rem 0;
      padding: .8rem 1.2rem;
      background: rgba(124,131,255,.06);
      border-radius: 0 8px 8px 0;
    }
    #content blockquote p {
      font-size: .88rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.7;
    }

    /* Tables */
    #content table {
      width: 100%;
      border-collapse: collapse;
      font-size: .86rem;
      margin: 1rem 0 1.5rem;
    }
    #content th {
      background: var(--card);
      color: var(--istio);
      font-weight: 600;
      text-align: left;
      padding: .55rem .9rem;
      border: 1px solid var(--border);
    }
    #content td {
      padding: .5rem .9rem;
      border: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
    }
    #content tr:nth-child(even) td { background: rgba(255,255,255,.02); }

    /* Badges / img (shields.io) */
    #content img { vertical-align: middle; margin: .1rem .15rem; }

    /* Mermaid */
    #content .mermaid {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem 1.5rem;
      margin: 1.5rem 0;
      overflow-x: auto;
      text-align: center;
    }
    #content .mermaid svg { max-width: 100%; height: auto; }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .82rem;
    }
  </style>
</head>
<body>

<nav>
  <span class="logo">☸ Cloud Native PoC</span>
  <a href="index.html" class="active">📄 README</a>
  <span class="sep">|</span>
  <a href="architecture.html">🏗 Architecture</a>
  <a href="network.html">🕸 Network</a>
  <a href="services.html">🔗 Services</a>
</nav>

<main>
  <div id="loading">
    <div class="spinner"></div>
    README.md を読み込んでいます…
  </div>

  <div id="error">
    <h3>読み込みエラー</h3>
    <p>README.md の取得に失敗しました。<code>file://</code> プロトコルでは fetch が使えません。</p>
    <p style="margin-top:1rem;font-size:.85rem;color:var(--muted);">
      以下のコマンドでローカルサーバーを起動してください：
    </p>
    <pre style="margin-top:.8rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:1rem;font-family:monospace;font-size:.82rem;color:var(--keda)">make docs-serve
# → http://localhost:8888 で開く</pre>
  </div>

  <article id="content" style="display:none"></article>
</main>

<footer>Cloud Native AI Agent Infra PoC — README.md をそのまま描画しています</footer>

<script type="module">
  import { marked } from 'https://esm.sh/marked@13';
  import mermaid from 'https://esm.sh/mermaid@11';

  mermaid.initialize({
    startOnLoad: false,
    theme: 'dark',
    darkMode: true,
    fontFamily: "'Segoe UI', system-ui, sans-serif",
    themeVariables: {
      background: '#161b27',
      primaryColor: '#7c83ff',
      primaryTextColor: '#cdd9f0',
      lineColor: '#6b7a99',
      edgeLabelBackground: '#161b27',
    }
  });

  const loading = document.getElementById('loading');
  const error   = document.getElementById('error');
  const content = document.getElementById('content');

  try {
    const res = await fetch('../README.md');
    if (!res.ok) throw new Error(res.statusText);
    const md = await res.text();

    content.innerHTML = marked.parse(md);

    // marked renders ```mermaid as <pre><code class="language-mermaid">
    // Convert to <div class="mermaid"> for Mermaid.js
    content.querySelectorAll('pre code.language-mermaid').forEach(el => {
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = el.textContent;
      el.closest('pre').replaceWith(div);
    });

    await mermaid.run({ nodes: content.querySelectorAll('.mermaid') });

    loading.style.display = 'none';
    content.style.display = '';
  } catch (e) {
    loading.style.display = 'none';
    error.style.display = 'block';
  }
</script>
</body>
</html>
